apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
spec:
  replicas: 2
  selector:
    matchLabels: {app: backend}
  template:
    metadata:
      labels: {app: backend}
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: backend
          image: ghcr.io/OWNER/wallet-service:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef: {name: wallet-config}
            - secretRef: {name: wallet-secrets}
          env:
            - {name: SPRING_PROFILES_ACTIVE, value: postgres}
          ports: [{name: http, containerPort: 8080}]
          readinessProbe:
            httpGet: {path: /actuator/health/readiness, port: http}
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /actuator/health/liveness, port: http}
            initialDelaySeconds: 30
            periodSeconds: 15
          resources:
            requests: {cpu: 150m, memory: 256Mi}
            limits: {cpu: 750m, memory: 768Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: backend
spec:
  selector: {app: backend}
  ports: [{name: http, port: 8080, targetPort: http}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: transaction-service
spec:
