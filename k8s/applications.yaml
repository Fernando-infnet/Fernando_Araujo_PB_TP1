  template:
    metadata:
      labels: {app: transaction-service}
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: transaction-service
          image: ghcr.io/OWNER/transaction-service:latest
          imagePullPolicy: IfNotPresent
          envFrom:
