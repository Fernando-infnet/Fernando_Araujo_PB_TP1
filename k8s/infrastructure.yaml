apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: rabbitmq-data
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rabbitmq
spec:
  replicas: 1
  selector:
    matchLabels: {app: rabbitmq}
  template:
    metadata:
      labels: {app: rabbitmq}
    spec:
      hostname: rabbitmq
      containers:
        - name: rabbitmq
          image: rabbitmq:3.13-management-alpine
          command: [sh, -c, "rabbitmq-plugins enable --offline rabbitmq_prometheus && rabbitmq-server"]
          env:
            - {name: RABBITMQ_DEFAULT_USER, value: wallet}
            - name: RABBITMQ_DEFAULT_PASS
              valueFrom: {secretKeyRef: {name: wallet-secrets, key: RABBITMQ_PASSWORD}}
          ports:
            - {name: amqp, containerPort: 5672}
            - {name: management, containerPort: 15672}
            - {name: metrics, containerPort: 15692}
          readinessProbe:
            exec: {command: [rabbitmq-diagnostics, -q, ping]}
            initialDelaySeconds: 10
            periodSeconds: 10
          volumeMounts: [{name: data, mountPath: /var/lib/rabbitmq}]
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: "1", memory: 768Mi}
      volumes: [{name: data, persistentVolumeClaim: {claimName: rabbitmq-data}}]
---
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
spec:
  selector: {app: rabbitmq}
  ports:
    - {name: amqp, port: 5672, targetPort: 5672}
    - {name: management, port: 15672, targetPort: 15672}
    - {name: metrics, port: 15692, targetPort: 15692}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: tempo-config
data:
  tempo.yml: |
    server:
      http_listen_port: 3200
    distributor:
      receivers:
        zipkin:
    storage:
      trace:
        backend: local
        local:
          path: /var/tempo/traces
        wal:
          path: /var/tempo/wal
    compactor:
      compaction:
        block_retention: 24h
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tempo
spec:
  replicas: 1
  selector:
    matchLabels: {app: tempo}
  template:
    metadata:
      labels: {app: tempo}
    spec:
      containers:
        - name: tempo
          image: grafana/tempo:2.6.1
          args: ["-config.file=/etc/tempo/tempo.yml"]
          ports:
            - {name: http, containerPort: 3200}
            - {name: zipkin, containerPort: 9411}
          readinessProbe:
            httpGet: {path: /ready, port: http}
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: 500m, memory: 512Mi}
          volumeMounts:
            - {name: config, mountPath: /etc/tempo}
            - {name: data, mountPath: /var/tempo}
      volumes:
        - name: config
          configMap: {name: tempo-config}
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: tempo
spec:
  selector: {app: tempo}
  ports:
    - {name: http, port: 3200, targetPort: http}
    - {name: zipkin, port: 9411, targetPort: zipkin}
