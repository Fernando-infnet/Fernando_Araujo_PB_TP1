apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: wallet-db-data
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wallet-db
spec:
  replicas: 1
  selector:
    matchLabels: {app: wallet-db}
  template:
    metadata:
      labels: {app: wallet-db}
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          env:
            - {name: POSTGRES_DB, value: wallet}
            - {name: POSTGRES_USER, value: wallet}
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: wallet-secrets, key: DB_PASSWORD}}
          ports: [{containerPort: 5432}]
          readinessProbe:
            exec: {command: [pg_isready, -U, wallet, -d, wallet]}
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts: [{name: data, mountPath: /var/lib/postgresql/data}]
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 500m, memory: 512Mi}
      volumes: [{name: data, persistentVolumeClaim: {claimName: wallet-db-data}}]
---
apiVersion: v1
kind: Service
metadata:
  name: wallet-db
spec:
  selector: {app: wallet-db}
  ports: [{port: 5432, targetPort: 5432}]
---
