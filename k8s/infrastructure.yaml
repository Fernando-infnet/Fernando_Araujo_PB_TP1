apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: rabbitmq-data
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rabbitmq
spec:
  replicas: 1
  selector:
    matchLabels: {app: rabbitmq}
  template:
    metadata:
      labels: {app: rabbitmq}
    spec:
      containers:
        - name: rabbitmq
          image: rabbitmq:3.13-management-alpine
          command: [sh, -c, "rabbitmq-plugins enable --offline rabbitmq_prometheus && rabbitmq-server"]
          env:
            - {name: RABBITMQ_DEFAULT_USER, value: wallet}
            - name: RABBITMQ_DEFAULT_PASS
              valueFrom: {secretKeyRef: {name: wallet-secrets, key: RABBITMQ_PASSWORD}}
          ports:
            - {name: amqp, containerPort: 5672}
            - {name: management, containerPort: 15672}
            - {name: metrics, containerPort: 15692}
          readinessProbe:
            exec: {command: [rabbitmq-diagnostics, -q, ping]}
            initialDelaySeconds: 10
            periodSeconds: 10
          volumeMounts: [{name: data, mountPath: /var/lib/rabbitmq}]
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: "1", memory: 768Mi}
      volumes: [{name: data, persistentVolumeClaim: {claimName: rabbitmq-data}}]
---
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
spec:
  selector: {app: rabbitmq}
  ports:
    - {name: amqp, port: 5672, targetPort: 5672}
    - {name: management, port: 15672, targetPort: 15672}
    - {name: metrics, port: 15692, targetPort: 15692}
