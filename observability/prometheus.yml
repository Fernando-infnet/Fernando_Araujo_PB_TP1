global:
  scrape_interval: 15s

scrape_configs:
  - job_name: wallet-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["backend:8080"]

  - job_name: transaction-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["transaction-service:8081"]

  - job_name: rabbitmq
    static_configs:
      - targets: ["rabbitmq:15692"]
