spring.datasource.url=${TRANSACTION_DB_URL:jdbc:postgresql://localhost:5434/transactions}
spring.datasource.username=${TRANSACTION_DB_USERNAME:transactions}
spring.datasource.password=${TRANSACTION_DB_PASSWORD:transactions}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=false
