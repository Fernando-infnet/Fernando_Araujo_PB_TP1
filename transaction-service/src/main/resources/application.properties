server.port=8081
spring.application.name=transaction-service
spring.config.import=optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}
spring.cloud.openfeign.client.config.wallet-service.url=${WALLET_SERVICE_URL:http://localhost:8080}
spring.cloud.openfeign.client.config.wallet-service.connectTimeout=2000
spring.cloud.openfeign.client.config.wallet-service.readTimeout=5000

spring.datasource.url=jdbc:h2:file:./data/transactionsdb;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:wallet}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:wallet}
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.template.mandatory=true
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-attempts=3
spring.rabbitmq.listener.simple.retry.initial-interval=500ms
spring.rabbitmq.listener.simple.default-requeue-rejected=false

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
management.health.config.enabled=false
info.app.name=Transaction Service
info.app.description=Microsserviço de lançamentos da Wallet Platform
